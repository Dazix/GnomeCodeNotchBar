name: Bug report
description: Something does not work or shows wrong numbers
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Do not open an issue; see [SECURITY.md](../blob/main/SECURITY.md).
        Never paste a token, a credentials file or an unredacted log line containing one.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      multiple: true
      options:
        - Claude
        - GitHub Copilot
        - Codex
        - Cursor
        - Antigravity
        - Not agent-specific
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: GNOME Shell version
      description: Output of `gnome-shell --version`
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version or commit
      description: The version on extensions.gnome.org, or `git rev-parse --short HEAD`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `journalctl -b -g codenotchbar`, with any token redacted.
      render: text
